name: GreenProof CI
on:
  push:
    branches: [main, forest-loss-zk]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  circuit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo install --git https://github.com/iden3/circom.git --tag v2.1.6 circom
      - run: npm ci
      - run: mkdir -p ../circuits/build ../circuits/circomlib && cp -r node_modules/circomlib/circuits/* ../circuits/circomlib/
      - run: circom ../circuits/environmental_compliance.circom --r1cs --wasm --sym -l ../circuits -o ../circuits/build
      - run: node -e "const p=require('poseidon-lite'); if(typeof p.poseidon5!=='function') process.exit(1)"
